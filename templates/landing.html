<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Booking Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-5">Reconciliation to Check Report</h1>

    <div class="row justify-content-center g-4">
        {% for dest in destinations %}
        <div class="col-md-3 col-sm-6">
            <a href="{{ url_for('destination', dest=dest) }}" class="card text-center text-white h-100 shadow-lg destination-card">
                <div class="card-body d-flex flex-column justify-content-center align-items-center">
                    <h4 class="card-title">{{ dest }}</h4>
                    <p class="card-text">Click to do report</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Logo at the bottom -->
<div class="logo-divider">
    <img src="https://desertgate.ae/wp-content/uploads/2025/05/White-DG-Logo1.png" alt="Desert Gate Logo" class="logo">
    
</div>
<p class="developer-credit">
    Developed by <span>Maya Abapo </span> rAWRr © 2026
</p>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
